# This CI job installs Crystal and shard dependencies, then executes `crystal spec` to run the test suite
# More configuration options are available at https://crystal-lang.github.io/install-crystal/configurator.html

name: Matrix Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
      - dev
      - wip
    tags:
      - "v*"

concurrency:
  group: ${{ github.sha }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-15
          - os: macos-15-intel
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Download source
        uses: actions/checkout@v4
      - uses: extractions/setup-crate@v1
        with:
          repo: casey/just
      - uses: actions/setup-go@v5
        if: ${{ !startsWith(matrix.os, 'ubuntu') }}
        with:
          go-version: stable
      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
      - name: Install shards
        run: shards install
      - name: unix Build
        if: ${{ !startsWith(matrix.os, 'windows') }}
        run: just upload
      - name: windows Build
        if: startsWith(matrix.os, 'windows')
        run: |
          C:/msys64/usr/bin/pacman.exe -Sy --noconfirm zip
          just upload
      - name: Upload Artifact
        uses: actions/upload-artifact@v5
        with:
          name: choose-${{ github.ref_name }}-${{ matrix.os }}
          path: |
            upload/*.zip
            upload/*.sha256sum
      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GHP }}
          files: |
            upload/*.zip
            upload/*.sha256sum
